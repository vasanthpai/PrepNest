# Dependabot opens PRs to keep dependencies and GitHub Actions up to date.
# Each PR runs CI like any other change; review and merge (rebase) if green.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: ["type: chore", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Fewer, bigger PRs: all minor + patch updates of one kind together.
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Held at 6.x until typescript-eslint and @astrojs/check support 7 (ADR 0008).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node type definitions follow the Node version we run (.nvmrc), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: ["type: ci", "dependencies"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
