name: Bug report
description: Something is broken or behaves wrongly
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see? Include error messages exactly as shown.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - production
        - staging
        - local
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Redmi 12, Chrome 140, Android 15
  - type: markdown
    attributes:
      value: |
        **Security issues:** don't file them here. See `SECURITY.md` to report privately.
