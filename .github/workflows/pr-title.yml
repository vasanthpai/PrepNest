# PR titles must follow Conventional Commits (e.g. "feat: add blog pages").
# They become commit history and feed the changelog.
name: PR title

on:
  # Plain pull_request: runs the workflow from the PR branch with a read-only token,
  # which is all a title check needs. ("edited" re-runs it when the title changes.)
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            ci
            refactor
            perf
            build
            revert
          requireScope: false
          # "feat: Add blog" is rejected; "feat: add blog" passes.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" must start with a lowercase letter.
