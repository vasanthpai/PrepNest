# A live preview of every pull request:
#   https://pr-<number>-prepnest-staging.prepnest.workers.dev
# Built with staging settings and uploaded as a new VERSION of the staging Worker under a stable
# alias. Uploading a version does not deploy it: live staging keeps serving main.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to the PR replaces the in-progress preview.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # the sticky preview comment

jobs:
  preview:
    name: Preview deploy
    # PRs from forks and Dependabot don't receive secrets (GitHub's design), so they can't deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}

    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Staging settings, but the PREVIEW's own address for canonical links, og:image, sitemap, RSS.
      - name: Build with staging settings
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging
          PREVIEW_PR: ${{ github.event.pull_request.number }}

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} at ${HEAD_SHA:0:7}" 2>&1 | tee upload.log
          url=$(grep -oE "https://pr-${PR_NUMBER}-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then echo "::error::No preview alias URL in Wrangler output"; exit 1; fi
          # The pages were built for an expected address (src/config/urls.ts). If Cloudflare assigned
          # a different one, link previews and canonicals would point elsewhere: fail loudly.
          canonical=$(grep -o 'rel="canonical" href="[^"]*"' dist/client/index.html | sed 's/.*href="//; s/"$//')
          if [ "$canonical" != "$url/" ]; then
            echo "::error::Built for ${canonical} but Cloudflare serves ${url}/. Update previewUrlFor()."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test the preview
        id: smoke
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: npm run smoke -- --url "$PREVIEW_URL" --env staging --version "$(node -p "require('./package.json').version")"

      # One comment per PR, edited on every push (found by a hidden marker), so the PR stays tidy.
      - name: Comment the preview URL on the PR
        if: always() && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          marker="<!-- prepnest-preview -->"
          if [ "$SMOKE" = "success" ]; then smoke="✅ passed"; else smoke="❌ failed (see the Preview run)"; fi
          body="${marker}
          ### Preview ready

          | | |
          |---|---|
          | **URL** | ${PREVIEW_URL} |
          | **Commit** | \`${HEAD_SHA:0:7}\` |
          | **Smoke test** | ${smoke} |

          Built with **staging** settings (feature flags as on staging). Updated on every push."
          body=$(printf '%s\n' "$body" | sed 's/^          //')
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
          echo "Preview: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
