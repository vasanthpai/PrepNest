# Deploys main to the staging Worker, but only after CI has passed on that exact commit.
# Release process: merge → (CI) → staging → manual test → tag → production.
name: Deploy staging

on:
  # Runs when the CI workflow finishes on main. The job below only continues if CI succeeded.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual re-deploy of main (Actions → Deploy staging → Run workflow).
  workflow_dispatch:

# One staging deploy at a time. Later ones queue; a running deploy is never cancelled halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to staging
    # Deploy only when CI passed for a PUSH to main in THIS repository. Without the last two
    # checks, a pull request from a fork whose branch is named "main" would also match and run
    # here with our deploy secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment provides CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID and records the
    # deployment (with its URL) in the repo's Environments panel.
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for staging
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging

      # v0.3: database migrations run here, BEFORE the new code goes live:
      # - name: Migrate staging database
      #   run: npm run db:migrate
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Could not find the deployed URL in Wrangler output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test the live site
        run: npm run smoke -- --url "${{ steps.deploy.outputs.url }}" --env staging --version "$(node -p "require('./package.json').version")"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Staging deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ steps.deploy.outputs.url || 'not deployed' }} |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s) |"
            echo "| Version | $(node -p "require('./package.json').version") |"
            echo "| Health | ${{ steps.deploy.outputs.url }}/api/health |"
          } >> "$GITHUB_STEP_SUMMARY"
