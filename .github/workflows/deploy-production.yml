# Deploys a release tag (vX.Y.Z) to production, after a maintainer approves it.
#   tag pushed → verify → [approval] → build → deploy → smoke test → GitHub Release
#
# Rollback: Actions → Deploy production → Run workflow → "Use workflow from" → Tags → the PREVIOUS
# tag. It re-deploys that exact release (after approval) without creating a new GitHub Release.
name: Deploy production

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# One production deploy at a time; never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag, version and changelog
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Production deploys only run on a release tag. Choose a tag under 'Use workflow from'."
            exit 1
          fi
          version="${REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $package_version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $REF_NAME points to a commit that is not on main."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release $REF_NAME verified: on main, package.json $package_version, changelog present."

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production environment requires a reviewer to approve before this job starts,
    # and only then releases CLOUDFLARE_API_TOKEN to it.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          CLOUDFLARE_ENV: production

      # v0.3: database migrations run here, BEFORE the new code goes live.
      # They must be backward-compatible so the previous tag still works (rollback).
      # - name: Migrate production database
      #   run: npm run db:migrate
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Could not find the deployed URL in Wrangler output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test the live site
        run: npm run smoke -- --url "${{ steps.deploy.outputs.url }}" --env production --version "${{ needs.verify.outputs.version }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy: ${{ github.ref_name }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ steps.deploy.outputs.url || 'not deployed' }} |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s) |"
            echo "| Trigger | ${{ github.event_name == 'workflow_dispatch' && 'manual (rollback / redeploy)' || 'tag push (release)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: [verify, deploy]
    # Only for a new release; a manual redeploy (rollback) of an older tag doesn't publish again.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::error::Empty release notes"; exit 1; fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag --latest
